{
  # parallelism settings
  "pipe-parallel-size": 1,
  "model-parallel-size": 1,

  # model settings
  "num-layers": 24,
  "hidden-size": 1024,
  "num-attention-heads": 16,
  "seq-length": 2048,
  "max-position-embeddings": 2048,
  "pos-emb": "rotary",
  "rotary-pct": 0.25,
  "no-weight-tying": true,
  "gpt-j-residual": true,
  "output-layer-parallelism": "column",
  
  "attention-config": [[["flash"], 24]],

  "scaled-upper-triang-masked-softmax-fusion": true,
  "bias-gelu-fusion": true,

  # init methods
  "init_method": "small_init",
  "output_layer_init_method": "wang_init",

  "optimizer": {
    "type": "Adam_mini",
    "params": {
      "lr": 0.0003,
      "betas": [0.9, 0.95],
      "eps": 1.0e-8
    }
  },
  "min_lr": 0.00003,

  "zero_optimization": {
    "stage": 1,
    "allgather_partitions": true,
    "allgather_bucket_size": 500000000,
    "overlap_comm": true,
    "reduce_scatter": true,
    "reduce_bucket_size": 500000000,
    "contiguous_gradients": true,
    "cpu_offload": false
  },

  # batch size (trained on 4 gpus)
  "train_micro_batch_size_per_gpu": 32,
  "gas": 8,
  "data-impl": "mmap",
  "num_workers": 1,

  # activation checkpointing
  "checkpoint-activations": true,
  "checkpoint-num-layers": 1,
  "partition-activations": true,
  "synchronize-each-layer": true,

  # regularization
  "gradient_clipping": 1.0,
  "weight-decay": 0.1,
  "hidden-dropout": 0,
  "attention-dropout": 0,

  # precision settings
  "fp16": {
    "fp16": true,
    "enabled": true,
    "loss_scale": 0,
    "loss_scale_window": 1000,
    "initial_scale_power": 12,
    "hysteresis": 2,
    "min_loss_scale": 1,
  },
  # 10B tokens / (1024 sequences x 2048 tokens) = 4769
  "train-iters": 5,
  "lr-decay-iters": 5,
  "distributed-backend": "nccl",
  "lr-decay-style": "cosine",
  "warmup": 0.01,
  "checkpoint-factor": 1000,
  "extra-save-iters": [0,1,2,4,8,16,32,64,128,256,512],
  "eval-interval": 200,
  "eval-iters": 10,

  "log-interval": 10,
  "steps_per_print": 10,
  "wall_clock_breakdown": true,

  "train-data-paths": ["/local/home/aziane/data/pile-merged/standard/document"],
  "valid-data-paths": ["/local/home/aziane/data/pile-merged/standard/document"],
  "test-data-paths": ["/local/home/aziane/data/pile-merged/standard/document"],

  "tokenizer-type": "HFTokenizer",
  "vocab-file": "/local/home/aziane/data/pile-merged/20B_tokenizer.json",

  "theoretical_peak_tflops_per_gpu": 154.8,

  "use_wandb": true,
  "wandb_project": "pythia-410m-experiments",
  "wandb_group": "adammini-vanilla",
  "wandb_run_name": "410m-adammini-10B-run1",

  "save": "/checkpoints/pythia-410m-adammini",
  "load": "/checkpoints/pythia-410m-adammini",
  "checkpoint_validation_with_forward_pass": false,

  "launcher": "slurm",
  "deepspeed_slurm": true,
}